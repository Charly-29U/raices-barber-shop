<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC872"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF2A3"/>
      <stop offset="75%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
    
    <linearGradient id="darkGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B5B11"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#4E3A0B"/>
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Golden Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#goldGlow)" />

  <!-- Outer Double Ornamental Rings -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 5" opacity="0.8"/>
  <circle cx="250" cy="250" r="200" fill="#0A0A0A" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="250" cy="250" r="192" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Star Embellishments -->
  <polygon points="250,55 253,65 264,65 255,72 258,82 250,76 242,82 245,72 236,65 247,65" fill="url(#goldGrad)"/>
  <polygon points="120,250 126,242 124,253 134,250 126,256 130,264 122,259 116,266 117,256 108,252" fill="url(#goldGrad)" transform="scale(0.8) translate(30, 60)"/>
  <polygon points="380,250 386,242 384,253 394,250 386,256 390,264 382,259 376,266 377,256 368,252" fill="url(#goldGrad)" transform="scale(0.8) translate(70, 60)"/>

  <!-- Royal Crown -->
  <g fill="url(#goldGrad)" stroke="#4E3A0B" stroke-width="1" filter="url(#goldShine)">
    <path d="M200,160 L215,125 L235,145 L250,110 L265,145 L285,125 L300,160 Z"/>
    <rect x="200" y="162" width="100" height="7" rx="3.5" fill="url(#goldGrad)"/>
    <circle cx="215" cy="123" r="3.5" fill="#FFF2A3"/>
    <circle cx="250" cy="108" r="4.5" fill="#FFF2A3"/>
    <circle cx="285" cy="123" r="3.5" fill="#FFF2A3"/>
  </g>

  <!-- Crossed Vintage Scissors and Straight Razor -->
  <!-- Scissor Blade 1 -->
  <g stroke="url(#goldGrad)" fill="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Blade -->
    <path d="M190,320 C200,310 230,270 275,200 L265,195 C220,260 185,295 175,305 Z" fill="url(#goldGrad)"/>
    <!-- Right Blade -->
    <path d="M310,320 C300,310 270,270 225,200 L235,195 C280,260 315,295 325,305 Z" fill="url(#goldGrad)"/>
    
    <!-- Scissor Finger Loops -->
    <circle cx="170" cy="335" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="330" cy="335" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
    <line x1="185" y1="320" x2="175" y2="305" stroke="url(#goldGrad)" stroke-width="5"/>
    <line x1="315" y1="320" x2="325" y2="305" stroke="url(#goldGrad)" stroke-width="5"/>
    
    <!-- Center Pivot Gem -->
    <circle cx="250" cy="245" r="7" fill="#FFF2A3" stroke="#5A430E" stroke-width="2"/>
  </g>

  <!-- Barber Pole Stripes Emblem / Center Banner -->
  <path d="M140,295 Q250,335 360,295" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M150,305 Q250,345 350,305" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>

  <!-- Brand Typography Arc or Text -->
  <text x="250" y="225" font-family="'Cinzel', serif" font-size="28" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">
    RAÍCES
  </text>
  <text x="250" y="270" font-family="'Great Vibes', cursive, 'Brush Script MT', serif" font-size="44" fill="#FFF2A3" text-anchor="middle" filter="url(#goldShine)">
    Barber Shop
  </text>
  <text x="250" y="375" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="5">
    • EST. 2018 •
  </text>
  <text x="250" y="398" font-family="'Cinzel', serif" font-size="10.5" fill="#C5A03A" text-anchor="middle" letter-spacing="4">
    EXCELLENCE &amp; MASTERY
  </text>
</svg>
